backend:
  name: git-gateway
  branch: main

media_folder: "Images"
public_folder: "/Images"

collections:
  - name: "agenda"
    label: "Agenda de Eventos"
    folder: "_agenda"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título do Evento", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Local", name: "location", widget: "string" }